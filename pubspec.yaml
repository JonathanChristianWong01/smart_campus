name: mulia_smart_campus
description: "Smart Campus Universitas Mulia — kurikulum S1 Informatika, tautan belajar Dicoding dan login lokal, kompiler daring (C++, JavaScript, PHP, Python), dan repositori GitHub."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Menampilkan aset lokal Web Biro Akademik dan halaman mata kuliah
  webview_flutter: ^4.2.0
  # Menyimpan akun/materi lokal, link repositori dan riwayat eksekusi kode
  shared_preferences: ^2.3.0
  # Hash password untuk login lokal (PBKDF2)
  cryptography: 2.7.0
  # Memanggil API kompiler Judge0 dan pencarian repositori GitHub
  http: ^1.2.0
  # Membuka Dicoding, GitHub dan situs eksternal melalui browser
  url_launcher: ^6.3.0
  # Utilitas dokumen PDF; dipertahankan untuk kompatibilitas source yang masih mengimpor
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/matkul/
